name: 테스트 및 빌드

on:
  pull_request:
  push:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python 데이터 검증
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 준비
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Python 의존성 설치
        run: pip install -r requirements-dev.txt
      - name: 단위 테스트 및 커밋된 JSON 검증
        run: pytest -q

  web:
    name: 웹 테스트 및 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 의존성 설치
        run: npm ci
      - name: 웹 단위 테스트
        run: npm test
      - name: 타입 검사 및 정적 사이트 빌드
        run: npm run build

  smoke:
    name: 브라우저 스모크 테스트
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/web/.cache/ms-playwright
    defaults:
      run:
        working-directory: web
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 의존성 설치
        run: npm ci
      - name: Chromium 및 실행 의존성 설치
        run: npx playwright install --with-deps chromium
      - name: 스모크 테스트용 사이트 빌드
        run: npm run build
      - name: 데스크톱 및 모바일 스모크 테스트
        run: npm run test:e2e
