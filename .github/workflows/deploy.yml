name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 배포할 정적 사이트 빌드
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js 준비
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 웹 의존성 설치
        run: npm ci
      - name: 웹 단위 테스트
        run: npm test
      - name: 사이트 및 version.json 빌드
        run: npm run build
      - name: 기존 GitHub Pages 설정 확인
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - name: Pages 빌드 산출물 업로드
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Pages 배포 및 커밋 확인
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: 배포된 version.json의 커밋 검증
        timeout-minutes: 10
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          version_url="${PAGE_URL%/}/version.json"
          for attempt in 1 2 3 4 5 6; do
            if version_json="$(curl --silent --show-error --location --fail \
              --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 60 \
              --connect-timeout 5 --max-time 15 \
              --header 'Cache-Control: no-cache' \
              "${version_url}?commit=${GITHUB_SHA}")"; then
              if printf '%s' "$version_json" | python3 -c '
          import json
          import os
          import sys

          actual = json.load(sys.stdin).get("commit")
          matches = actual == os.environ["GITHUB_SHA"]
          print("version.json 커밋 일치" if matches else "version.json 커밋 불일치")
          sys.exit(0 if matches else 1)
          '; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo '::error::배포된 version.json의 커밋을 확인하지 못했습니다.'
          exit 1
